<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3legant - Signing In...</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #ffffff;
      color: #141718;
      text-align: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #E8ECEF;
      border-top-color: #141718;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    p {
      color: #6C7275;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 28px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background-color: #E8ECEF;
      color: #141718;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 52px;
      background-color: #141718;
      color: #ffffff;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      transition: background-color 0.15s ease, transform 0.1s ease;
      touch-action: manipulation;
    }
    .btn-primary:active {
      transform: scale(0.97);
      background-color: #232627;
    }
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 46px;
      background-color: transparent;
      color: #141718;
      border: 1.5px solid #E8ECEF;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      margin-top: 12px;
      touch-action: manipulation;
      transition: background-color 0.15s ease;
    }
    .btn-secondary:active {
      background-color: #F3F5F7;
    }
    .sub-link {
      margin-top: 18px;
      font-size: 13px;
      color: #6C7275;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      padding: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="spinner" class="spinner"></div>
    <div class="badge" id="token-badge">✓ Tokens Verified</div>
    <h2>Authentication Successful!</h2>
    <p id="status-text">Returning you to the 3legant mobile app...</p>
    
    <a id="return-btn" class="btn-primary" href="javascript:void(0)" onclick="launchApp(false)">
      Open 3legant App
    </a>
    
    <a id="direct-btn" class="btn-secondary" href="javascript:void(0)" onclick="launchApp(true)">
      Direct Scheme Link (3legant://)
    </a>

    <button id="copy-btn" class="sub-link" onclick="copySessionData()">
      Copy session link to clipboard
    </button>
  </div>

  <script>
    var intentUrl = '';
    var schemeUrl = '';
    var primaryUrl = '';
    var isAndroid = /Android/i.test(navigator.userAgent);
    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    (function init() {
      var hash = window.location.hash ? window.location.hash.substring(1) : '';
      var search = window.location.search ? window.location.search.substring(1) : '';

      var hashParams = new URLSearchParams(hash);
      var searchParams = new URLSearchParams(search);

      var appRedirect = searchParams.get('app_redirect') || hashParams.get('app_redirect') || '';

      // Collect all OAuth tokens/params while omitting internal app_redirect
      var cleanParams = new URLSearchParams();
      hashParams.forEach(function(val, key) {
        if (key !== 'app_redirect') cleanParams.set(key, val);
      });
      searchParams.forEach(function(val, key) {
        if (key !== 'app_redirect') cleanParams.set(key, val);
      });

      var payload = cleanParams.toString();

      var isExpo = appRedirect && appRedirect.indexOf('exp://') === 0;

      if (isExpo) {
        var base = decodeURIComponent(appRedirect);
        var joinChar = base.indexOf('?') !== -1 ? '&' : '?';
        schemeUrl = base + (payload ? (joinChar + payload) : '');
        intentUrl = schemeUrl;
      } else {
        // Standalone APK
        schemeUrl = '3legant://auth/callback' + (payload ? ('?' + payload) : '');
        // Explicit Android Intent URI required by Chrome on Android
        intentUrl = 'intent://auth/callback' + (payload ? ('?' + payload) : '') +
          '#Intent;scheme=3legant;package=com.threelegant.storefront;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end';
      }

      primaryUrl = isAndroid ? intentUrl : schemeUrl;

      var returnBtn = document.getElementById('return-btn');
      var directBtn = document.getElementById('direct-btn');

      if (returnBtn) returnBtn.href = primaryUrl;
      if (directBtn) directBtn.href = schemeUrl;

      // Automatic launch attempt after short delay to allow complete rendering
      setTimeout(function() {
        launchApp(false, true);
      }, 300);
    })();

    function launchApp(preferScheme, isAuto) {
      var target = preferScheme ? schemeUrl : primaryUrl;
      if (!target) return;

      var statusText = document.getElementById('status-text');
      var returnBtn = document.getElementById('return-btn');

      if (!isAuto) {
        if (statusText) statusText.innerText = 'Opening 3legant app...';
        if (returnBtn) returnBtn.innerText = 'Opening...';
      }

      console.log('[3legant Bridge] Launching target:', target);

      // 1. Direct location navigation
      try {
        window.location.href = target;
      } catch (err) {
        console.error('Direct navigation failed:', err);
      }

      // 2. Fallback to custom scheme after 500ms
      setTimeout(function() {
        try {
          window.location.href = schemeUrl;
        } catch (e) {}

        // 3. Fallback iframe injection
        try {
          var iframe = document.createElement('iframe');
          iframe.style.display = 'none';
          iframe.src = schemeUrl;
          document.body.appendChild(iframe);
          setTimeout(function() {
            if (iframe && iframe.parentNode) iframe.parentNode.removeChild(iframe);
          }, 1000);
        } catch (e) {}

        if (returnBtn) returnBtn.innerText = 'Open 3legant App';
      }, 500);
    }

    function copySessionData() {
      var target = primaryUrl || schemeUrl || window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(target).then(function() {
          var copyBtn = document.getElementById('copy-btn');
          if (copyBtn) {
            copyBtn.innerText = '✓ Copied to clipboard!';
            setTimeout(function() {
              copyBtn.innerText = 'Copy session link to clipboard';
            }, 3000);
          }
        });
      } else {
        var input = document.createElement('textarea');
        input.value = target;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        var btn = document.getElementById('copy-btn');
        if (btn) btn.innerText = '✓ Copied to clipboard!';
      }
    }
  </script>
</body>
</html>
