<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3legant - Signing In...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #ffffff;
      color: #141718;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #E8ECEF;
      border-top-color: #141718;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 20px;
      margin: 0 0 8px;
    }
    p {
      color: #6C7275;
      font-size: 14px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Completing Sign In...</h2>
  <p>Returning you to the 3legant app</p>

  <script>
    (function() {
      // Capture tokens from hash or query
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      var params = hash || search;

      // Deep link back to the mobile app scheme as a secondary fallback
      if (params) {
        window.location.href = '3legant://auth/callback' + params;
      }
    })();
  </script>
</body>
</html>
